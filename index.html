<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe2c6">
  <link rel="icon" href="demo-b/icons/icon-192.png">
  <link rel="manifest" href="demo-b/manifest.webmanifest">
  <meta http-equiv="refresh" content="0; url=demo-b/index.html">
  <title>火山严选 · 手帐食谱本</title>
  <link rel="stylesheet" href="shared/base.css">
  <style>
    body.land-body {
      display: block;
      background-color: var(--kraft-700);
      color: var(--ink);
    }
    .land {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 22px;
    }
    .land-card {
      position: relative;
      width: 100%;
      padding: 34px 26px 30px;
      background-color: var(--kraft-100);
      background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.34), transparent 44%),
        var(--noise);
      background-size: auto, 160px 160px;
      box-shadow: var(--shadow);
      text-align: center;
      transform: rotate(-0.4deg);
    }
    .land-card .vs-seal {
      width: 56px;
      height: 56px;
      font-size: 17px;
      margin: 0 auto 16px;
    }
    .land-card h1 {
      font-family: var(--font-hand);
      font-size: 28px;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .land-card p {
      color: var(--ink-soft);
      font-family: var(--font-hand);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 22px;
    }
    .land-go {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 26px;
      border: 1.5px solid var(--seal-deep);
      border-radius: 3px;
      background: var(--seal);
      color: var(--kraft-50);
      font-family: var(--font-hand);
      font-size: 18px;
      letter-spacing: 0.08em;
      text-decoration: none;
      box-shadow: 2px 2px 0 rgba(74, 55, 36, 0.18);
    }
    .land-note {
      margin-top: 16px;
      font-size: 11.5px;
      color: var(--ink-soft);
      opacity: 0.8;
    }
  </style>
</head>
<body class="land-body">
  <main class="land">
    <section class="land-card">
      <div class="vs-seal" aria-hidden="true"><span>火</span><span>山</span><span>严</span><span>选</span></div>
      <h1>手帐食谱本</h1>
      <p>自己记的，最合自己胃口。<br>正在打开你的菜谱本…</p>
      <a class="land-go" href="demo-b/index.html">进入食谱本 ›</a>
      <p class="land-note">没有自动跳转？点上面的按钮即可。</p>
    </section>
  </main>
  <script>
    window.location.replace("demo-b/index.html");
  </script>
</body>
</html>
