<!DOCTYPE html>
<html lang="zh-CN" data-demo="c">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241b14">
  <link rel="icon" href="data:,">
  <title>火山严选 · 深夜灶台</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app app-c">
    <div class="c-lamp" aria-hidden="true"></div>

    <header class="c-top">
      <button class="c-menu-btn" id="c-open-drawer" type="button" aria-label="打开菜单" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 7h16M4 12h11M4 17h14"/>
        </svg>
      </button>
      <div class="c-brand">
        <div class="vs-seal" aria-hidden="true"><span>火</span><span>山</span><span>严</span><span>选</span></div>
        <div class="c-brand__text">
          <span class="c-brand__name">火山严选</span>
          <span class="c-brand__sub">深夜厨房</span>
        </div>
      </div>
      <span class="c-top__date" id="c-top-date">11.07</span>
    </header>

    <main class="c-main">
      <div class="c-datewrap"><div id="c-dates"></div></div>
      <div class="c-banner is-hidden" id="c-banner"></div>

      <section class="c-hero" id="c-hero" aria-label="这一餐"></section>

      <section class="c-others" aria-labelledby="c-others-title">
        <div class="c-sechead">
          <h2 id="c-others-title">今天还有</h2>
          <button class="c-sechead__link" id="c-order-all" type="button">＋ 点一道</button>
        </div>
        <div class="c-rail" id="c-rail"></div>
      </section>

      <section class="c-recent" aria-labelledby="c-recent-title">
        <div class="c-sechead">
          <h2 id="c-recent-title">最近点过</h2>
          <button class="c-sechead__link" id="c-open-lib" type="button">菜谱库 ›</button>
        </div>
        <div class="c-rail c-rail--recipes" id="c-recent"></div>
      </section>
    </main>

    <div class="c-fan-scrim" id="c-fan-scrim"></div>
    <div class="c-fan" id="c-fan" aria-hidden="true">
      <button class="c-fan__item" type="button" data-action="order">
        <span class="c-fan__glyph">点</span>
        <span>点一道菜</span>
      </button>
      <button class="c-fan__item" type="button" data-action="wheel">
        <span class="c-fan__glyph">转</span>
        <span>随机转盘</span>
      </button>
      <button class="c-fan__item" type="button" data-action="write">
        <span class="c-fan__glyph">写</span>
        <span>写菜谱</span>
      </button>
    </div>
    <button class="c-fab" id="c-fab" type="button" aria-label="打开点菜操作" aria-expanded="false" aria-controls="c-fan">
      <span class="c-fab__glyph">点</span>
      <span class="c-fab__label">菜</span>
    </button>

    <div class="c-drawer-scrim" id="c-drawer-scrim"></div>
    <aside class="c-drawer" id="c-drawer" aria-hidden="true" aria-label="菜单">
      <div class="c-drawer__head">
        <div class="vs-seal" aria-hidden="true"><span>火</span><span>山</span><span>严</span><span>选</span></div>
        <div class="c-drawer__titles">
          <span class="c-drawer__name">火山严选</span>
          <span class="c-drawer__sub">自家厨房 · 认真吃饭</span>
        </div>
        <button class="c-drawer__close" id="c-close-drawer" type="button" aria-label="关闭菜单">×</button>
      </div>
      <nav class="c-drawer__nav">
        <button class="c-drawer__item" type="button" data-open="library">
          <span class="c-drawer__glyph">谱</span>
          <span class="c-drawer__label">菜谱库</span>
          <span class="c-drawer__meta" id="c-drawer-libcount">12 道</span>
        </button>
        <button class="c-drawer__item" type="button" data-open="calendar">
          <span class="c-drawer__glyph">历</span>
          <span class="c-drawer__label">日历</span>
          <span class="c-drawer__meta">翻旧页</span>
        </button>
        <button class="c-drawer__item" type="button" data-open="about">
          <span class="c-drawer__glyph">?</span>
          <span class="c-drawer__label">关于</span>
          <span class="c-drawer__meta">›</span>
        </button>
      </nav>
      <p class="c-drawer__note">自家厨房，认真吃饭。</p>
    </aside>
  </div>

  <script src="../shared/data.js"></script>
  <script src="../shared/wheel.js"></script>
  <script src="../shared/kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
