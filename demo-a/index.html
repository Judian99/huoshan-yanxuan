<!DOCTYPE html>
<html lang="zh-CN" data-demo="a">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8d7b6">
  <link rel="icon" href="data:,">
  <title>火山严选 · 餐牌厨房</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app app-a">
    <main class="a-main">

      <!-- 今日 -->
      <section class="a-view is-active" data-view="today" aria-label="今日餐牌">
        <header class="a-head">
          <div class="a-brand">
            <div class="vs-seal" aria-hidden="true"><span>火</span><span>山</span><span>严</span><span>选</span></div>
            <div class="a-brand__text">
              <p class="a-brand__kick">自家厨房</p>
              <h1 class="a-brand__name">火山严选</h1>
            </div>
          </div>
          <div class="a-head__date" aria-label="当前查看日期">
            <span class="a-head__md" id="a-head-md">11.07</span>
            <span class="a-head__wd" id="a-head-wd">周五</span>
          </div>
        </header>

        <div class="a-intro">
          <h2 id="a-greeting">今天想吃点什么？</h2>
          <p id="a-sub">点一道菜，或者让转盘替你决定。</p>
        </div>

        <div class="a-datewrap">
          <div id="a-dates"></div>
        </div>

        <div class="a-banner is-hidden" id="a-future"></div>

        <section class="a-board" aria-labelledby="a-board-title">
          <h2 class="vs-sr-only" id="a-board-title">当天五餐</h2>
          <span class="vs-tape a-board__tape" aria-hidden="true"></span>
          <div class="a-board__twine" aria-hidden="true">
            <svg viewBox="0 0 540 34" preserveAspectRatio="none" focusable="false">
              <path d="M0 17 Q 90 33 180 17 T 360 17 T 540 17" fill="none" stroke="rgba(90,60,30,.42)" stroke-width="1.4" vector-effect="non-scaling-stroke"></path>
            </svg>
          </div>
          <div class="a-slips" id="a-slips"></div>
        </section>

        <div class="a-summary" id="a-summary"></div>

        <section class="a-recent" aria-labelledby="a-recent-title">
          <div class="a-sechead">
            <h2 id="a-recent-title">最近点过</h2>
            <button class="vs-link" id="a-see-recipes" type="button">去菜谱本 ›</button>
          </div>
          <div class="a-recent__rail" id="a-recent"></div>
        </section>

        <p class="a-footnote">自家厨房 · 认真吃饭</p>
      </section>

      <!-- 菜谱 -->
      <section class="a-view" data-view="recipes" aria-label="菜谱本">
        <header class="a-viewhead">
          <div>
            <h2 class="a-viewhead__title">菜谱本</h2>
            <p class="a-viewhead__sub" id="a-recipe-count">一共 12 道</p>
          </div>
          <button class="vs-btn vs-btn--seal vs-btn--sm" id="a-write" type="button">写菜谱</button>
        </header>
        <div class="a-search">
          <input class="vs-input" id="a-search" type="search" placeholder="找菜名，也可以搜食材" autocomplete="off">
        </div>
        <div class="vs-chiprow a-filters" id="a-filters" aria-label="按时段筛选"></div>
        <div class="a-grid" id="a-grid"></div>
      </section>

      <!-- 转盘 -->
      <section class="a-view" data-view="wheel" aria-label="随机转盘">
        <header class="a-viewhead">
          <div>
            <h2 class="a-viewhead__title">让转盘决定</h2>
            <p class="a-viewhead__sub">先选一餐，剩下的交给运气。</p>
          </div>
        </header>
        <div class="vs-chiprow a-wheel-filters" id="a-wheel-filters" aria-label="转盘候选范围"></div>
        <label class="a-switch">
          <input type="checkbox" id="a-avoid">
          <span class="a-switch__box" aria-hidden="true"></span>
          <span>避开今天已经点过的菜</span>
        </label>
        <div class="a-wheelframe">
          <span class="vs-tape a-wheelframe__tape" aria-hidden="true"></span>
          <div id="a-wheel"></div>
        </div>
        <p class="a-wheelnote">转到哪道，就把它放进这一天的一餐。点轮心那个「转」字。</p>
        <div class="a-wheelcand" id="a-wheel-cand"></div>
      </section>

      <!-- 日历 -->
      <section class="a-view" data-view="calendar" aria-label="日历">
        <header class="a-viewhead">
          <div>
            <h2 class="a-viewhead__title">翻日历</h2>
            <p class="a-viewhead__sub">有红点的日子，都开过火。</p>
          </div>
        </header>
        <div class="a-calcard paper">
          <span class="vs-tape a-calcard__tape" aria-hidden="true"></span>
          <div id="a-calendar"></div>
        </div>
        <div class="a-day" id="a-day"></div>
      </section>

    </main>

    <nav class="a-tabs" aria-label="主导航">
      <button class="a-tab is-active" type="button" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11h16c0 4.2-3.6 7.2-8 7.2S4 15.2 4 11Z"/><path d="M8.5 7c0 .8.8.9.8 1.8M12 5.6c0 1 .8 1 .8 2M15.5 7c0 .8.8.9.8 1.8"/></svg>
        <span>餐单</span>
      </button>
      <button class="a-tab" type="button" data-tab="recipes">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 4.5h9.5A1.5 1.5 0 0 1 17 6v14H7.5A1.5 1.5 0 0 1 6 18.5v-14Z"/><path d="M6 17.5a1.5 1.5 0 0 1 1.5-1.5H17"/></svg>
        <span>菜谱</span>
      </button>
      <button class="a-tab" type="button" data-tab="wheel">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"/><path d="M12 4v3.4M12 12l3.6 2.6"/></svg>
        <span>转盘</span>
      </button>
      <button class="a-tab" type="button" data-tab="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <span>日历</span>
      </button>
    </nav>
  </div>

  <script src="../shared/data.js"></script>
  <script src="../shared/wheel.js"></script>
  <script src="../shared/kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
